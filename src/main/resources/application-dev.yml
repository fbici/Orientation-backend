spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/orientation_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

# Swagger accessible sans auth en dev
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

# CORS : autoriser le frontend Angular, l'app mobile, et le dev local
app:
  cors:
    allowed-origins: http://localhost:4200,http://localhost:3000,http://localhost:8080,http://10.0.2.2,http://127.0.0.1
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600
