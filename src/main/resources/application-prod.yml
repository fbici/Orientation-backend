# === PROFIL PRODUCTION — Render ===

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    defer-datasource-initialization: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    clean-disabled: true
  batch:
    jdbc:
      initialize-schema: never
    job:
      enabled: false
  data:
    redis:
      host: ""
  sql:
    init:
      mode: never
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.websocket.WebSocketAutoConfiguration

# Render fournit le PORT dynamiquement
server:
  port: ${PORT:8080}
  address: 0.0.0.0
  servlet:
    context-path: /

# Logging reduit en production
logging:
  level:
    root: WARN
    com.orientation.orientationapp: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

# CORS
app:
  base-url: ${APP_BASE_URL}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600
  registration:
    tenant-code: ${REGISTRATION_TENANT_CODE:DEFAULT}
  ocr:
    tesseract-command: ${TESSERACT_COMMAND:tesseract}
    languages: ${OCR_LANGUAGES:fra+eng}
    tessdata-dir: ${TESSDATA_DIR:}
    timeout-seconds: ${OCR_TIMEOUT_SECONDS:45}
  notifications:
    admin-email: ${ADMIN_NOTIFICATION_EMAIL:adminorientia@gmail.com}
    admin-email-enabled: ${ADMIN_NOTIFICATIONS_EMAIL_ENABLED:true}
  sendgrid:
    api-key: ${SENDGRID_API_KEY:}
    from-email: ${SENDGRID_FROM_EMAIL:}
    enabled: ${SENDGRID_ENABLED:false}
