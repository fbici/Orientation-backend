# === PROFIL PRODUCTION — Railway ===

spring:
  datasource:
    url: ${DATABASE_URL}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

# Railway fournit le PORT dynamiquement
server:
  port: ${PORT:8080}
  address: 0.0.0.0

# Logging réduit en production
logging:
  level:
    root: WARN
    com.orientation.orientationapp: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

# CORS — autoriser l'app mobile et le frontend Angular
app:
  cors:
    allowed-origins: http://localhost:4200,http://localhost:3000,http://localhost:8080,http://10.0.2.2,http://127.0.0.1,*
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600
  sendgrid:
    api-key: ${SENDGRID_API_KEY:}
    from-email: ${SENDGRID_FROM_EMAIL:noreply@orientia.com}
    enabled: ${SENDGRID_ENABLED:false}
