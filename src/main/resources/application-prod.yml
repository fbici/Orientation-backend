# === PROFIL PRODUCTION — Render ===

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/orientation_db}}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true
  flyway:
    enabled: false
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false
  data:
    redis:
      host: ""
  sql:
    init:
      mode: always
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.websocket.WebSocketAutoConfiguration

# Render fournit le PORT dynamiquement
server:
  port: ${PORT:8080}
  address: 0.0.0.0

# Logging reduit en production
logging:
  level:
    root: WARN
    com.orientation.orientationapp: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

# CORS
app:
  cors:
    allowed-origins: http://localhost:4200,http://localhost:3000,http://localhost:8080,http://10.0.2.2,http://127.0.0.1,*
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600
  sendgrid:
    api-key: ${SENDGRID_API_KEY:}
    from-email: ${SENDGRID_FROM_EMAIL:noreply@orientia.com}
    enabled: ${SENDGRID_ENABLED:false}
