spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orientation_prod}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: OrientationProdPool
      maximum-pool-size: 30
      minimum-idle: 10
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      leak-detection-threshold: 60000

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

# Production logging
logging:
  level:
    root: WARN
    com.orientation.orientationapp: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

# Actuator for production (limited)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
