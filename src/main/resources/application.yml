spring:
  application:
    name: orientia-backend
  profiles:
    active: dev
  main:
    allow-bean-definition-overriding: true

  # JPA / Hibernate
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        default_batch_fetch_size: 16
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  # Jackson
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  # Multipart (file upload)
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Server
server:
  port: 8080
  servlet:
    context-path: /api/v1

# Logging
logging:
  level:
    root: INFO
    com.orientation.orientationapp: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/orientation-backend.log

# SpringDoc OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
    try-it-out-enabled: true
  packages-to-scan: com.orientation.orientationapp.modules.*.controller

# Custom application properties
app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-very-long-secret-key-at-least-256-bits-long-for-production}
    expiration: 86400000  # 24 hours
    refresh-expiration: 604800000  # 7 days
    header: Authorization
    prefix: "Bearer "
  storage:
    upload-dir: ${STORAGE_DIR:./uploads}
    allowed-types: application/pdf,image/jpeg,image/png
    max-size: 10485760  # 10MB
  cors:
    allowed-origins: http://localhost:3000,http://localhost:4200
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600

  # Base URL for email links
  base-url: ${APP_BASE_URL:https://orientation-backend-4lcp.onrender.com}

  # SendGrid Email Service
  sendgrid:
    api-key: ${SENDGRID_API_KEY:}
    from-email: ${SENDGRID_FROM_EMAIL:noreply@orientia.com}
    enabled: ${SENDGRID_ENABLED:false}
